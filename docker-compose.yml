version: '3.8'

services:
  # PostgreSQL Database (for production/docker deployment)
  postgres:
    image: postgres:16-alpine
    container_name: eldercare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eldercare_user
      POSTGRES_PASSWORD: eldercare_secure_password
      POSTGRES_DB: eldercare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldercare_user -d eldercare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eldercare_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "eldercare_super_secure_jwt_secret_key_2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "5000:5000"

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eldercare_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
